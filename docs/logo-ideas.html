<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Manrope:wght@800&display=swap">
<style>
body{margin:0;padding:32px;background:#f7f9f5;font-family:"DM Sans",sans-serif;color:#293c33;width:1180px}
h1{font-family:Manrope;font-size:30px;letter-spacing:-1px;color:#234b34;margin:0 0 4px}
.sub{margin:0 0 24px;color:#5f6b5b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid #e1e7dc;border-radius:16px;padding:20px}
.row{display:flex;align-items:center;gap:18px}
.big{width:120px;height:120px}
.sizes{display:flex;align-items:flex-end;gap:12px;margin-left:auto}
.sizes svg:nth-child(1){width:16px;height:16px}.sizes svg:nth-child(2){width:32px;height:32px}.sizes svg:nth-child(3){width:48px;height:48px}
.dark{background:#202124;border-radius:8px;padding:6px;display:flex;gap:8px;align-items:center}
.dark svg{width:16px;height:16px}
h2{font-family:Manrope;font-size:18px;margin:14px 0 4px;color:#234b34}
p{margin:0;font-size:13px;color:#5f6b5b;line-height:1.45}
.tag{display:inline-block;font-size:11px;font-weight:600;background:#e7efdc;border-radius:999px;padding:2px 8px;margin-top:8px}
</style></head><body>
<h1>Evergreen logo ideas</h1>
<p class="sub">Each shown large, then at 16 / 32 / 48 px (real toolbar sizes) and on a dark toolbar. Nothing has been changed yet.</p>
<div class="grid" id="grid"></div>
<script>
const G='#264e36', S='#89ad63', L='#eff6df', D='#173826';
const logos = [
 {name:'1 · Chat pine', why:'A pine tree whose tiers are speech bubbles: AI conversations growing into something green. Reads clearly at 16px.', tag:'Recommended',
  svg:`<rect width="64" height="64" rx="16" fill="${G}"/><path d="M32 9 L45 25 H37 L48 38 H38 L51 51 H13 L26 38 H16 L27 25 H19 Z" fill="${L}"/><path d="M27 51 v4 h10 v-4" fill="${S}"/><path d="M40 51 l5 6 l-1 -6z" fill="${L}"/>`},
 {name:'2 · Sprout bubble', why:'A speech bubble with a sprout inside: "talk to AI, mindfully". Friendly, matches the plant in the popup.',
  svg:`<rect width="64" height="64" rx="16" fill="${L}"/><path d="M12 14 h40 a6 6 0 0 1 6 6 v20 a6 6 0 0 1 -6 6 h-22 l-10 9 v-9 h-8 a6 6 0 0 1 -6 -6 v-20 a6 6 0 0 1 6 -6z" fill="${G}"/><path d="M32 42 V27" stroke="${L}" stroke-width="3.5" stroke-linecap="round"/><path d="M32 32 C24 32 20 27 20 21 C27 21 31 25 32 32Z" fill="${S}"/><path d="M32 29 C39 29 44 25 44 18 C37 18 33 22 32 29Z" fill="${L}"/>`},
 {name:'3 · Leaf "e"', why:'A lowercase e whose bowl is a leaf, matching the "evergreen." wordmark. Most brand-like and minimal.',
  svg:`<rect width="64" height="64" rx="32" fill="${G}"/><path d="M47 40 A17 17 0 1 1 48 30 H18" fill="none" stroke="${L}" stroke-width="7" stroke-linecap="round"/><path d="M22 30 C24 20 36 16 46 21 C42 27 33 31 22 30Z" fill="${S}"/>`},
 {name:'4 · Circuit roots', why:'A pine whose roots are circuit traces: nature above, technology below. Tells the AI + environment story best, but busier when tiny.',
  svg:`<rect width="64" height="64" rx="16" fill="${D}"/><path d="M32 8 L44 24 H38 L47 36 H17 L26 24 H20 Z" fill="${S}"/><rect x="29.5" y="36" width="5" height="8" fill="${L}"/><path d="M32 44 v6 M32 46 h-10 v8 M32 46 h10 v8 M22 54 h-4 M42 54 h4" stroke="${L}" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="18" cy="54" r="2.5" fill="${L}"/><circle cx="46" cy="54" r="2.5" fill="${L}"/><circle cx="32" cy="51" r="2.5" fill="${L}"/>`},
 {name:'5 · Footprint pine', why:'A footprint whose sole is a pine silhouette: a direct nod to "carbon footprint". Strong concept, needs care at 16px.',
  svg:`<rect width="64" height="64" rx="16" fill="${L}"/><path d="M32 22 L43 38 H37 L45 50 C45 56 39 59 32 59 C25 59 19 56 19 50 L27 38 H21 Z" fill="${G}"/><circle cx="22" cy="12" r="4" fill="${S}"/><circle cx="31" cy="9" r="4.5" fill="${S}"/><circle cx="40" cy="11" r="4" fill="${S}"/><circle cx="47" cy="17" r="3.2" fill="${S}"/>`},
 {name:'6 · Evergreen ring', why:'A pine inside a circular arrow: renewal and reducing. Simple and eco-familiar, but closer to generic recycling icons.',
  svg:`<rect width="64" height="64" rx="32" fill="${L}"/><path d="M50 22 A21 21 0 1 0 53 36" fill="none" stroke="${S}" stroke-width="5" stroke-linecap="round"/><path d="M53 13 V24 H42" fill="none" stroke="${S}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 16 L41 29 H36 L43 40 H21 L28 29 H23 Z" fill="${G}"/><rect x="30" y="40" width="4" height="6" fill="${G}"/>`},
];
const mk = (s, cls='') => `<svg class="${cls}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
document.getElementById('grid').innerHTML = logos.map(l => `<div class="card"><div class="row">${mk(l.svg,'big')}<div class="sizes">${mk(l.svg)}${mk(l.svg)}${mk(l.svg)}</div></div>
<div class="row" style="margin-top:10px"><div class="dark">${mk(l.svg)}<span style="color:#bbb;font-size:11px">dark toolbar</span></div></div>
<h2>${l.name}</h2><p>${l.why}</p>${l.tag?`<span class="tag">${l.tag}</span>`:''}</div>`).join('');
</script></body></html>
